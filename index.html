<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinis Burgers - POS & Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #1d3557;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2b2d42;
            --success: #2a9d8f;
            --danger: #d90429;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
        header { background-color: var(--secondary); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .section { display: none; }
        .section.active { display: block; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 12px; color: var(--secondary); font-size: 1.1rem; }
        
        label { display: block; font-size: 0.9rem; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }

        .kpi-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .kpi-card { background: var(--secondary); color: white; padding: 15px; border-radius: 10px; text-align: center; }
        .kpi-card h3 { font-size: 0.8rem; opacity: 0.8; }
        .kpi-card p { font-size: 1.3rem; font-weight: bold; margin-top: 5px; }

        .grid-productos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-producto { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; }
        .item-producto.selected { border-color: var(--primary); background-color: #ffe5e8; }

        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); padding: 6px 10px; width: auto; margin-top: 0; }
        .btn-edit { background-color: var(--secondary); padding: 6px 10px; width: auto; margin-top: 0; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .actions { display: flex; gap: 5px; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; border-top: 1px solid #ddd; padding: 10px 0; }
        nav div { text-align: center; font-size: 0.8rem; color: #666; cursor: pointer; }
        nav div.active { color: var(--primary); font-weight: bold; }
        nav div span { display: block; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>🍔 Chinis Burgers POS</header>

    <div class="container">
        <!-- VISTA DE VENTAS -->
        <div id="sec-ventas" class="section active">
            <h2>Registrar Venta Rápidamente</h2>
            <div id="grid-productos" class="grid-productos"></div>
            <button class="btn-success" onclick="procesarVenta()">Confirmar y Cobrar</button>
        </div>

        <!-- VISTA DE DASHBOARD -->
        <div id="sec-dashboard" class="section">
            <h2>📊 Métricas del Día</h2>
            <div class="kpi-container">
                <div class="kpi-card">
                    <h3>VENTAS HOY</h3>
                    <p id="kpi-monto">$0.00</p>
                </div>
                <div class="kpi-card">
                    <h3>PEDIDOS HOY</h3>
                    <p id="kpi-pedidos">0</p>
                </div>
            </div>

            <div class="card">
                <h2>🍔 Productos Más Vendidos</h2>
                <canvas id="chartTopProductos"></canvas>
            </div>

            <div class="card">
                <h2>🍕 Distribución por Categorías</h2>
                <canvas id="chartCategorias"></canvas>
            </div>
        </div>

        <!-- VISTA DE INSUMOS -->
        <div id="sec-insumos" class="section">
            <div class="card">
                <h2>📦 Cargar / Comprar Insumo</h2>
                <label>Nombre del Insumo</label>
                <input type="text" id="ins-nombre" placeholder="Ej: Harina 0000 / Caja de Pizza">
                
                <label>Cantidad Comprada</label>
                <input type="number" id="ins-cantidad" placeholder="Ej: 25 (o 100 para cajas)">
                
                <label>Unidad de Medida</label>
                <select id="ins-unidad">
                    <option value="kg">Kilogramos (kg)</option>
                    <option value="g">Gramos (g)</option>
                    <option value="un">Unidades (un)</option>
                    <option value="l">Litros (l)</option>
                    <option value="ml">Mililitros (ml)</option>
                </select>

                <label>Precio Total Pagado ($)</label>
                <input type="number" id="ins-precio" step="0.01" placeholder="Ej: 18000">

                <button class="btn-success" onclick="guardarInsumo()">Cargar al Inventario</button>
            </div>

            <div class="card">
                <h2>Inventario Actual</h2>
                <div id="lista-insumos"></div>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN -->
    <nav>
        <div class="nav-item active" onclick="cambiarSeccion('sec-ventas', this)"><span>🛒</span>Vender</div>
        <div class="nav-item" onclick="cambiarSeccion('sec-dashboard', this)"><span>📈</span>Dashboard</div>
        <div class="nav-item" onclick="cambiarSeccion('sec-insumos', this)"><span>📦</span>Insumos</div>
    </nav>

    <script>
        const API_URL = "https://chinis-burgers.onrender.com"; 
        let chartTop, chartCat;

        function cambiarSeccion(idSeccion, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(idSeccion).classList.add('active');
            el.classList.add('active');

            if (idSeccion === 'sec-dashboard') cargarDashboard();
            if (idSeccion === 'sec-insumos') cargarInsumos();
            if (idSeccion === 'sec-ventas') cargarProductos();
        }

        async function guardarInsumo() {
            const nombre = document.getElementById('ins-nombre').value.trim();
            const cantidad = parseFloat(document.getElementById('ins-cantidad').value);
            const unidad = document.getElementById('ins-unidad').value;
            const precio = parseFloat(document.getElementById('ins-precio').value);

            if (!nombre || isNaN(cantidad) || isNaN(precio)) {
                alert("⚠️ Por favor completa todos los campos correctamente.");
                return;
            }

            const data = {
                nombre: nombre,
                unidad_medida: unidad,
                cantidad_comprada: cantidad,
                precio_total: precio,
                stock_minimo: 0
            };

            try {
                const res = await fetch(`${API_URL}/insumos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(`✅ Insumo '${nombre}' cargado con éxito`);
                    document.getElementById('ins-nombre').value = '';
                    document.getElementById('ins-cantidad').value = '';
                    document.getElementById('ins-precio').value = '';
                    cargarInsumos();
                } else {
                    alert("❌ Error al guardar insumo.");
                }
            } catch (e) { console.error(e); }
        }

        async function cargarInsumos() {
            try {
                const res = await fetch(`${API_URL}/insumos`);
                const insumos = await res.json();
                let html = '';
                insumos.forEach(i => {
                    html += `
                        <div class="list-item">
                            <div>
                                <strong>${i.nombre}</strong><br>
                                <small>Stock: ${i.cantidad_stock} ${i.unidad_medida} | Costo: $${i.costo_unitario.toFixed(2)}/${i.unidad_medida}</small>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="editarInsumo(${i.id}, ${i.cantidad_stock}, ${i.costo_unitario})">✏️️</button>
                                <button class="btn-danger" onclick="eliminarInsumo(${i.id}, '${i.nombre}')">🗑️</button>
                            </div>
                        </div>`;
                });
                document.getElementById('lista-insumos').innerHTML = html || 'No hay insumos registrados.';
            } catch (e) { console.error("Error al cargar insumos:", e); }
        }

        async function editarInsumo(id, stockActual, costoActual) {
            // 1. Pregunta el stock actual
            const nuevoStock = prompt("Nuevo Stock total disponible:", stockActual);
            if (nuevoStock === null) return;

            // 2. Pregunta el precio de la bolsa/paquete
            const precioPaquete = prompt("¿Cuánto te salió la última compra / bolsa? ($):");
            if (precioPaquete === null) return;

            // 3. Pregunta la cantidad que traía ese paquete (ej: 25 kg o 100 cajas)
            const cantidadPaquete = prompt("¿De cuántos kg/unidades/litros era esa bolsa/paquete?:", 1);
            if (cantidadPaquete === null) return;

            const cantNum = parseFloat(cantidadPaquete);
            const precNum = parseFloat(precioPaquete);

            if (isNaN(cantNum) || cantNum <= 0 || isNaN(precNum)) {
                alert("⚠️ Por favor ingresa números válidos para el precio y la cantidad.");
                return;
            }

            // Cálculo automático del costo por unidad de medida (ej: $/kg)
            const nuevoCostoUnitario = precNum / cantNum;

            const data = {
                cantidad_stock: parseFloat(nuevoStock),
                costo_unitario: nuevoCostoUnitario
            };

            try {
                const res = await fetch(`${API_URL}/insumos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(`✅ Insumo actualizado. Nuevo costo calculado: $${nuevoCostoUnitario.toFixed(2)} por unidad/kg`);
                    cargarInsumos();
                } else {
                    alert("❌ Error al actualizar el insumo.");
                }
            } catch (e) {
                console.error("Error al conectar con la API:", e);
            }
        }

        async function eliminarInsumo(id, nombre) {
            if (!confirm(`¿Seguro que deseas eliminar '${nombre}' del inventario?`)) return;

            try {
                const res = await fetch(`${API_URL}/insumos/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("🗑️ Insumo eliminado");
                    cargarInsumos();
                } else {
                    alert("❌ Error al eliminar");
                }
            } catch (e) { console.error(e); }
        }

        async function cargarDashboard() {
            try {
                const res = await fetch(`${API_URL}/stats/dashboard`);
                const data = await res.json();

                document.getElementById('kpi-monto').innerText = `$${data.ventas_hoy_monto.toFixed(2)}`;
                document.getElementById('kpi-pedidos').innerText = data.ventas_hoy_cantidad;

                const ctxTop = document.getElementById('chartTopProductos').getContext('2d');
                if (chartTop) chartTop.destroy();
                chartTop = new Chart(ctxTop, {
                    type: 'bar',
                    data: {
                        labels: data.top_productos.map(p => p.nombre),
                        datasets: [{
                            label: 'Unidades Vendidas',
                            data: data.top_productos.map(p => p.cantidad),
                            backgroundColor: '#e63946'
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });

                const ctxCat = document.getElementById('chartCategorias').getContext('2d');
                if (chartCat) chartCat.destroy();
                chartCat = new Chart(ctxCat, {
                    type: 'doughnut',
                    data: {
                        labels: data.top_categorias.map(c => c.categoria),
                        datasets: [{
                            data: data.top_categorias.map(c => c.cantidad),
                            backgroundColor: ['#1d3557', '#e63946', '#2a9d8f', '#f4a261']
                        }]
                    },
                    options: { responsive: true }
                });

            } catch (e) { console.error("Error al cargar dashboard:", e); }
        }

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const productos = await res.json();
                let html = '';
                productos.forEach(p => {
                    html += `
                        <div class="item-producto" onclick="this.classList.toggle('selected')" data-id="${p.id}">
                            <strong>${p.nombre}</strong><br>
                            $${p.precio_venta.toFixed(2)}
                        </div>`;
                });
                document.getElementById('grid-productos').innerHTML = html || 'No hay productos creados.';
            } catch (e) { console.error(e); }
        }

        cargarProductos();
    </script>
</body>
</html>
